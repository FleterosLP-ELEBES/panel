name: Actualizar panel de fleteros

on:
  schedule:
    # Hora argentina (UTC-3, sin horario de verano). 3 intentos por turno porque
    # los cron gratis de GitHub a veces llegan tarde o no disparan; el robot solo
    # baja de verdad una vez al dia (skip inteligente), asi los reintentos saltan.
    - cron: "8 10 * * 1-5"    # 07:08 ART (manana)
    - cron: "38 10 * * 1-5"   # 07:38 ART
    - cron: "8 11 * * 1-5"    # 08:08 ART
    - cron: "8 17 * * 1-5"    # 14:08 ART (tarde, red de seguridad)
    - cron: "38 17 * * 1-5"   # 14:38 ART
    - cron: "8 18 * * 1-5"    # 15:08 ART
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hora argentina
        shell: powershell
        run: tzutil /s "Argentina Standard Time"

      - name: Correr robot (API Gescom)
        shell: powershell
        env:
          GESCOM_REALM: ${{ secrets.GESCOM_REALM }}
          GESCOM_USUARIO: ${{ secrets.GESCOM_USUARIO }}
          GESCOM_CLAVE: ${{ secrets.GESCOM_CLAVE }}
        run: powershell -NoProfile -File robot-nube.ps1

      - name: Publicar cambios
        shell: powershell
        run: |
          git config user.name "robot-lpe"
          git config user.email "robot-lpe@users.noreply.github.com"
          git add data.js historial-meses.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m ("Datos del " + (Get-Date -Format "dd/MM/yyyy HH:mm"))
            git push
          } else {
            Write-Output "Sin cambios: no hace falta publicar"
          }
